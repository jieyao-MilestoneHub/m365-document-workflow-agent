[project]
name = "ap-three-way-match"
version = "0.1.0"
description = "Agentic AP Invoice Three-Way Match agent for Microsoft 365 Copilot (Agents League AISF 2026)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Cloud/runtime extras — not needed for the deterministic core or its unit tests.
azure = [
    "azure-ai-documentintelligence>=1.0.0",
    "azure-ai-projects>=2.0.0b1",
    "azure-identity>=1.16",
]
agent = [
    "agent-framework>=1.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sse-starlette>=2.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "freezegun>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
