[project]
name = "ap-three-way-match"
version = "0.1.0"
description = "Agentic AP Invoice Three-Way Match agent for Microsoft 365 Copilot (Agents League AISF 2026)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Cloud/runtime extras — not needed for the deterministic core or its unit tests.
azure = [
    "azure-ai-documentintelligence>=1.0.0",
    "azure-ai-projects>=2.0.0b1",
    "azure-identity>=1.16",
]
agent = [
    "agent-framework>=1.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sse-starlette>=2.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "freezegun>=1.4",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Coverage is opt-in (run `pytest --cov=app`) so single-test runs aren't gated; the
# fail-under threshold below is enforced whenever coverage IS collected (e.g. CI).

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
